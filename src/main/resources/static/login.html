
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Retail | Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f0eaff, #e4f5e8, #f8f5ff);
            color: #343047;
        }
        .card {
            width: 90%;
            max-width: 410px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 12px 35px #594a771c;
        }
        h1 { text-align: center; color: #65519b; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #777; margin-bottom: 25px; }
        label { display: block; margin: 15px 0 7px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8d0e9;
            border-radius: 9px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: 0;
            border-radius: 9px;
            background: #719b79;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #587e60; }
        .message { padding: 10px; border-radius: 8px; text-align: center; }
        .error { background: #ffe8e8; color: #a52626; }
        .success { background: #e6f6e9; color: #28653a; }
        .link { text-align: center; margin-top: 20px; }
        a { color: #65519b; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h1>Smart Retail</h1>
    <p class="subtitle">Please sign in to continue</p>

    <p class="message error" th:if="${param.error}">
        Invalid credentials. Check your username and password.
    </p>

    <p class="message success" th:if="${success}" th:text="${success}"></p>

    <p class="message success" th:if="${param.logout}">
        You have logged out successfully.
    </p>

    <form action="/login" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text"
               placeholder="Enter username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="Enter password" required>

        <button type="submit">Sign In</button>
    </form>

    <p class="link">New user? <a th:href="@{/register}">Create an account</a></p>
</div>
</body>
</html>
