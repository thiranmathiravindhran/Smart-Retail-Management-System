
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Retail - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eee8f7, #dcefe3);
        }

        .login-box {
            width: 390px;
            max-width: 92%;
            padding: 38px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #8064a2;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #444;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5c9e5;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #8064a2;
            box-shadow: 0 0 4px rgba(128,100,162,0.3);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #8064a2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #684b8c;
        }

        .message {
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 7px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            color: #a32020;
            background: #ffe5e5;
        }

        .success {
            color: #176b39;
            background: #e0f5e7;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #555;
            font-size: 14px;
        }

        a {
            color: #8064a2;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Smart Retail</h1>

        <p class="subtitle">
            Management System
            <br><br>
            Please sign in to continue
        </p>

        <div id="message"></div>

        <form action="/login" method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Sign In
            </button>

        </form>

        <p class="register-link">
            New user?
            <a href="/register.html">Create an account</a>
        </p>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("message");

        if (params.has("error")) {
            message.innerHTML =
                '<div class="message error">Invalid credentials. Check your username and password.</div>';
        }

        if (params.has("logout")) {
            message.innerHTML =
                '<div class="message success">You have logged out successfully.</div>';
        }

        if (params.has("registered")) {
            message.innerHTML =
                '<div class="message success">Registration successful. Please sign in.</div>';
        }
    </script>

</body>
</html>
